name: Lighthouse audit

on:
  push:
    tags:
      - v**
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.1

      - name: Run Lighthouse audit
        run: lhci autorun --config=./lighthouserc.json

      - name: Add audit scores to the job summary
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-summary.mjs

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      # Final step: Force the job to fail if anything failed earlier
      - name: Check for Pre-Always Failures
        if: failure()
        run: |
          echo "A step failed before processing the lighthouse results. Failing the job now."
          exit 1