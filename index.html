<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6f42d9">
    <meta name="description" content="A simple SE and GBP value converter.">
    <title>SEx:y converter</title>
    <link rel="icon" href="images/sexy_icon.ico" type="image/vnd.microsoft.icon">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="top-nav" aria-label="Main navigation">
        <a class="nav-brand" href="index.html" aria-current="page">
          <img class="nav-home-icon" src="images/sexy_icon.png" alt="">
          <span>SEx:y converter</span>
        </a>
        <a class="nav-link" href="settings.html" aria-label="Settings">
          <svg class="nav-settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-1.99 1.76l-.14 1.05a2 2 0 0 1-1 1.45l-.63.36a2 2 0 0 1-1.76.1l-.96-.4a2 2 0 0 0-2.53.88l-.22.38a2 2 0 0 0 .52 2.58l.82.64a2 2 0 0 1 .74 1.72v.73a2 2 0 0 1-.74 1.72l-.82.64a2 2 0 0 0-.52 2.58l.22.38a2 2 0 0 0 2.53.88l.96-.4a2 2 0 0 1 1.76.1l.63.36a2 2 0 0 1 1 1.45l.14 1.05A2 2 0 0 0 11.78 22h.44a2 2 0 0 0 1.99-1.76l.14-1.05a2 2 0 0 1 1-1.45l.63-.36a2 2 0 0 1 1.76-.1l.96.4a2 2 0 0 0 2.53-.88l.22-.38a2 2 0 0 0-.52-2.58l-.82-.64a2 2 0 0 1-.74-1.72v-.73a2 2 0 0 1 .74-1.72l.82-.64a2 2 0 0 0 .52-2.58l-.22-.38a2 2 0 0 0-2.53-.88l-.96.4a2 2 0 0 1-1.76-.1l-.63-.36a2 2 0 0 1-1-1.45l-.14-1.05A2 2 0 0 0 12.22 2z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </a>
      </nav>
    </header>
    <main class="app-shell">
      <section class="converter-card" aria-labelledby="app-title">
        <h1 id="app-title">Convert a charge</h1>
        <p class="intro">Calculate Sports Engine charges like a pro 😁</p>

        <form class="converter" novalidate>
          <div class="field-group">
            <label for="se-value">SE charge</label>
            <div class="input-wrap">
              <span class="currency-symbol" aria-hidden="true">&#163;</span>
              <input id="se-value" name="se-value" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off">
            </div>
          </div>

          <div class="conversion-arrow" aria-hidden="true">
            <img src="images/conversion_icon.png">
          </div>

          <div class="field-group">
            <label for="gbp-value">Club receives</label>
            <div class="input-wrap">
              <span class="currency-symbol" aria-hidden="true">&#163;</span>
              <input id="gbp-value" name="gbp-value" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" autocomplete="off">
            </div>
          </div>
        </form>

        <p class="rate-note">club receives <strong>(££ x 0.9705) - 0.20</strong></p>
      </section>
    </main>
  </body>
</html>
